<div class="d-flex justify-content-center align-items-center vh-100 bg-light">
<div class="card shadow p-4" style="width: 28rem;">
<h2 class="text-center text-primary mb-3">Registro de Usuario</h2>
<p class="text-center text-muted mb-4">
  Crea un usuario para poder acceder a la informacion de tus cines y peliculas favoritos
</p>

<form (ngSubmit)="registrar()">

  <div class="mb-3">
  <label class="form-label">Nombre:</label>
  <input type="text" class="form-control" [(ngModel)]="nombre" name="nombre" required />
  </div>

   <div class="mb-3">
  <label class="form-label">Correo:</label>
  <input type="email" class="form-control" [(ngModel)]="correo" name="correo" required /><br>
  </div>

   <div class="mb-3">
  <label class="form-label">Contraseña:</label>
  <input type="password" class="form-control" [(ngModel)]="password" name="password" required /><br>
  </div>


   <div class="mb-3">
  <label class="form-label">Tipo de Usuario</label>
  <select class="form-select" name="" id="">
    <option value="ADMIN_SISTEMA">Administrador de sistema</option>
    <option value="ADMIN_CINE">Administrador de cine</option>
    <option value="USUARIO_COMUN">Usuario comun</option>
    <option value="USUARIO_ESPECIAL">Usuario especial</option>
  </select><br>
  </div>


  <button type="submit" class="btn btn-primary w-100">Registrarse</button>
</form>
 </div>
</div>
